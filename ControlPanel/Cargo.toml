[package]
name = "ControlPanel"
version = "0.1.0"
edition = "2024"

[dependencies]
webrtc = "0.11"
axum = { version = "0.8.9", features = ["ws"] }
fastrace = "0.7.19"
futures-util = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
